<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turnos VCR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');

  :root {
    --bg:          #f0f4ff;
    --surface:     #ffffff;
    --surface2:    #e8eeff;
    --border:      #c7d4f5;
    --blue-dark:   #1e3a8a;
    --blue-mid:    #1e40af;
    --blue-grad:   #3b82f6;
    --text:        #1e293b;
    --muted:       #64748b;
    --red:         #dc2626;
    --green:       #166534;
    --morning-bg:  #dbeafe;
    --morning-bd:  #3b82f6;
    --morning-txt: #1e40af;
    --evening-bg:  #fef9c3;
    --evening-bd:  #ca8a04;
    --evening-txt: #854d0e;
    --libre-bg:    #f8fafc;
    --lf-bg:       #f8fafc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-grad) 100%);
    padding: 16px 16px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(30,58,138,0.3);
  }
  .header-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: #fff; flex: 1; }
  .header-month { font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .clock { font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); padding: 4px 10px; border-radius: 6px; min-width: 52px; text-align: center; }

  /* UPLOAD */
  .upload-section { margin: 16px; border: 2px dashed var(--border); border-radius: 16px; padding: 32px 16px; text-align: center; background: var(--surface); cursor: pointer; transition: all 0.2s; }
  .upload-section:hover, .upload-section.dragover { border-color: var(--blue-grad); background: #eef2ff; }
  .upload-icon { font-size: 40px; margin-bottom: 10px; }
  .upload-title { font-size: 16px; font-weight: 700; color: var(--blue-mid); margin-bottom: 4px; }
  .upload-sub { font-size: 12px; color: var(--muted); }
  #fileInput { display: none; }

  /* BANNERS */
  .today-banner { margin: 16px 16px 10px; background: var(--surface); border: 2px solid var(--blue-grad); border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 0 0 4px rgba(59,130,246,0.1); }
  .today-icon { font-size: 26px; }
  .today-label { font-size: 10px; color: var(--blue-mid); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 3px; }
  .today-val { font-size: 15px; font-weight: 700; color: var(--text); }
  .today-area { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .next-banner { margin: 0 16px 12px; background: linear-gradient(135deg, var(--blue-dark), var(--blue-grad)); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 16px rgba(30,58,138,0.25); }
  .next-icon { font-size: 26px; }
  .next-label { font-size: 10px; color: rgba(255,255,255,0.75); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .next-val { font-size: 14px; font-weight: 700; color: #fff; }
  .next-area { font-size: 11px; color: rgba(255,255,255,0.8); margin-top: 2px; }

  /* STATS */
  .stats { display: flex; gap: 8px; margin: 0 16px 12px; overflow-x: auto; padding-bottom: 2px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 66px; flex-shrink: 0; }
  .stat-num { font-size: 20px; font-weight: 700; color: var(--blue-mid); line-height: 1; }
  .stat-lbl { font-size: 9px; color: var(--muted); margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

  /* CALENDAR */
  .calendar-wrap { margin: 0 16px 14px; }
  .cal-header { display: grid; grid-template-columns: repeat(7,1fr); background: var(--blue-dark); border-radius: 10px 10px 0 0; padding: 7px 4px; }
  .cal-header span { text-align: center; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 0.5px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; background: var(--surface2); padding: 4px; border-radius: 0 0 10px 10px; border: 1px solid var(--border); border-top: none; }

  .cal-day { aspect-ratio: 1; border-radius: 9px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; border: 1px solid transparent; }
  .cal-day:active { transform: scale(0.90); }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.morning { background: var(--morning-bg); border-color: var(--morning-bd); }
  .cal-day.evening { background: var(--evening-bg); border-color: var(--evening-bd); }
  .cal-day.libre   { background: var(--libre-bg); border-color: #e2e8f0; }
  .cal-day.lf      { background: var(--lf-bg); border-color: #e2e8f0; }
  .cal-day.is-today { box-shadow: 0 0 0 2.5px var(--blue-grad); }

  .cal-day .day-num { font-size: 14px; font-weight: 700; line-height: 1; }
  .cal-day.morning .day-num  { color: var(--morning-txt); }
  .cal-day.evening .day-num  { color: var(--evening-txt); }
  .cal-day.libre .day-num    { color: var(--red); }
  .cal-day.lf .day-num       { color: var(--green); }

  .cal-day .day-tag { font-size: 8px; font-weight: 700; margin-top: 2px; }
  .cal-day.morning .day-tag  { color: var(--morning-txt); opacity: 0.8; }
  .cal-day.evening .day-tag  { color: var(--evening-txt); opacity: 0.8; }
  .cal-day.libre .day-tag    { color: var(--red); opacity: 0.6; }
  .cal-day.lf .day-tag       { color: var(--green); font-weight: 800; }

  /* LEGEND */
  .legend { margin: 0 16px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .legend-dot.morning { background: var(--morning-bg); border: 1.5px solid var(--morning-bd); }
  .legend-dot.evening { background: var(--evening-bg); border: 1.5px solid var(--evening-bd); }
  .legend-dot.libre   { background: var(--libre-bg);   border: 1.5px solid #e2e8f0; }
  .legend-dot.lf      { background: var(--lf-bg);      border: 1.5px solid #bbf7d0; }

  /* VIEW TOGGLE */
  .view-toggle { margin: 0 16px 12px; display: flex; gap: 8px; }
  .toggle-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all 0.2s; background: var(--surface); color: var(--muted);
  }
  .toggle-btn.active {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue-grad));
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 12px rgba(30,58,138,0.25);
  }

  /* TABLE VIEW */
  .table-view { margin: 0 16px 24px; display: none; }
  .table-view.visible { display: block; }
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(30,58,138,0.08); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 12px; }
  thead tr { background: linear-gradient(135deg, var(--blue-dark), var(--blue-grad)); }
  thead th { padding: 10px 8px; text-align: left; font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 0.8px; white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:active { background: var(--surface2); }
  tbody td { padding: 9px 8px; vertical-align: middle; }
  .td-day { font-weight: 700; color: var(--blue-mid); min-width: 28px; }
  .td-dow { color: var(--muted); font-size: 11px; min-width: 32px; }
  .td-turno { font-weight: 700; min-width: 40px; }
  .td-horario { font-size: 11px; color: var(--text); min-width: 90px; }
  .td-area { color: var(--muted); font-size: 11px; }
  .td-estado span {
    padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 700;
    white-space: nowrap;
  }
  .badge-morning { background: var(--morning-bg); color: var(--morning-txt); border: 1px solid var(--morning-bd); }
  .badge-evening { background: var(--evening-bg); color: var(--evening-txt); border: 1px solid var(--evening-bd); }
  .badge-libre   { background: #fef2f2; color: var(--red); border: 1px solid #fca5a5; }
  .badge-lf      { background: #f0fdf4; color: var(--green); border: 1px solid #86efac; }
  tbody tr.row-libre td { color: var(--red); }
  tbody tr.row-libre .td-day { color: var(--red); }
  tbody tr.row-lf .td-day { color: var(--green); }
  tbody tr.row-today { background: rgba(59,130,246,0.07); }
  tbody tr.row-today .td-day::after { content: ' ◀'; font-size: 9px; color: var(--blue-grad); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 200; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 24px 24px 0 0; padding: 8px 20px 40px; width: 100%; max-width: 480px; box-shadow: 0 -8px 40px rgba(30,58,138,0.2); }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 20px; }
  .modal-date { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--blue-dark); margin-bottom: 4px; }
  .modal-dayname { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .modal-pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 50px; font-size: 14px; font-weight: 700; margin-bottom: 16px; }
  .modal-pill.morning { background: var(--morning-bg); color: var(--morning-txt); border: 1.5px solid var(--morning-bd); }
  .modal-pill.evening { background: var(--evening-bg); color: var(--evening-txt); border: 1.5px solid var(--evening-bd); }
  .modal-pill.libre   { background: #fef2f2; color: var(--red); border: 1.5px solid #fca5a5; }
  .modal-pill.lf      { background: #f0fdf4; color: var(--green); border: 1.5px solid #86efac; }
  .modal-rows { display: flex; flex-direction: column; gap: 10px; }
  .modal-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--bg); border-radius: 10px; border: 1px solid var(--border); }
  .modal-row-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .modal-row-val   { font-size: 14px; font-weight: 700; color: var(--text); }
  .modal-close { width: 100%; margin-top: 20px; padding: 14px; background: linear-gradient(135deg, var(--blue-dark), var(--blue-grad)); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; font-family: 'DM Sans', sans-serif; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">VCR Turnos</div>
  <div class="header-month" id="headerMonth">—</div>
  <div class="clock" id="clock">--:--</div>
</div>

<div class="upload-section" id="uploadSection" onclick="document.getElementById('fileInput').click()">
  <div class="upload-icon">📊</div>
  <div class="upload-title">Cargar Excel de turnos</div>
  <div class="upload-sub">Toca para seleccionar el archivo .xlsx generado por Claude</div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFile(event)">
</div>

<div id="mainContent" style="display:none">
  <div id="todayBanner"></div>
  <div id="nextBanner"></div>
  <div class="stats" id="statsBar"></div>

  <!-- TOGGLE BUTTONS -->
  <div class="view-toggle">
    <button class="toggle-btn active" id="btnCal"   onclick="showView('cal')">📅 Calendario</button>
    <button class="toggle-btn"        id="btnTable" onclick="showView('table')">📋 Tabla de áreas</button>
  </div>

  <!-- CALENDAR VIEW -->
  <div id="calView">
    <div class="calendar-wrap">
      <div class="cal-header">
        <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot morning"></div>Mañana (07–09h)</div>
      <div class="legend-item"><div class="legend-dot evening"></div>Tarde (15–16h)</div>
      <div class="legend-item"><div class="legend-dot lf"></div>Libre Festivo</div>
      <div class="legend-item"><div class="legend-dot libre"></div>Libre</div>
    </div>
  </div>

  <!-- TABLE VIEW -->
  <div class="table-view" id="tableView">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Día</th>
            <th>Día</th>
            <th>Turno</th>
            <th>Horario</th>
            <th>Estado</th>
            <th>Área</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-date" id="modalDate"></div>
    <div class="modal-dayname" id="modalDayname"></div>
    <div id="modalPill"></div>
    <div class="modal-rows" id="modalRows"></div>
    <button class="modal-close" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
  const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const DAYS_ES   = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const MORNING_SHIFTS = new Set(['6','63','7','73','8','83','9','93','10','103','11','113','12','123','13','133']);
  const EVENING_SHIFTS = new Set(['14','143','15','153','16','163','17','173','18']);

  let calData = [], calYear, calMonth;

  function updateClock() {
    document.getElementById('clock').textContent =
      new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }
  setInterval(updateClock, 1000); updateClock();

  const upload = document.getElementById('uploadSection');
  upload.addEventListener('dragover', e => { e.preventDefault(); upload.classList.add('dragover'); });
  upload.addEventListener('dragleave', () => upload.classList.remove('dragover'));
  upload.addEventListener('drop', e => { e.preventDefault(); upload.classList.remove('dragover'); processFile(e.dataTransfer.files[0]); });

  function handleFile(e) { processFile(e.target.files[0]); }

  function processFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        parseSheet(wb.Sheets[wb.SheetNames[0]]);
      } catch(err) { alert('Error al leer el archivo: ' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  }

  function parseSheet(ws) {
    const data = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    calData = []; calYear = null; calMonth = null;

    // Detect month/year from title row
    const MNAMES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
    for (let r = 0; r < Math.min(4, data.length); r++) {
      for (const cell of data[r]) {
        const m = String(cell||'').match(/(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)\s+(\d{4})/i);
        if (m) { calMonth = MNAMES.indexOf(m[1].toUpperCase()); calYear = parseInt(m[2]); }
      }
    }
    if (calMonth === null) { calMonth = new Date().getMonth(); calYear = new Date().getFullYear(); }

    // Find header row
    let headerRow=-1, colDia=-1, colTurno=-1, colHorario=-1, colEstado=-1, colArea=-1;
    for (let r = 0; r < data.length; r++) {
      const row = data[r].map(v => String(v||'').trim().toLowerCase());
      if (row.some(v => v==='día'||v==='dia')) {
        headerRow=r;
        colDia     = row.findIndex(v=>v==='día'||v==='dia');
        colTurno   = row.findIndex(v=>v==='turno');
        colHorario = row.findIndex(v=>v==='horario');
        colEstado  = row.findIndex(v=>v==='estado');
        colArea    = row.findIndex(v=>v==='área'||v==='area');
        break;
      }
    }
    if (headerRow===-1) { alert('No se encontró la cabecera. Asegúrate de usar el Excel generado por Claude.'); return; }

    for (let r = headerRow+1; r < data.length; r++) {
      const row   = data[r];
      const day   = parseInt(row[colDia]);
      if (isNaN(day)||day<1||day>31) continue;
      const turno   = String(row[colTurno]  ||'').trim();
      const horario = String(row[colHorario]||'').trim();
      const estado  = String(row[colEstado] ||'').trim().toLowerCase();
      const area    = colArea>=0 ? String(row[colArea]||'').trim() : '';

      let tipo;
      if (turno==='LF'||estado.includes('festivo'))   tipo='lf';
      else if (turno===''||estado.includes('libre'))  tipo='libre';
      else if (MORNING_SHIFTS.has(turno))             tipo='morning';
      else if (EVENING_SHIFTS.has(turno))             tipo='evening';
      else tipo='morning';

      calData.push({day, turno, horario, area, tipo});
    }

    document.getElementById('uploadSection').style.display='none';
    document.getElementById('mainContent').style.display='block';
    renderAll();
  }

  function showView(v) {
    document.getElementById('calView').style.display   = v==='cal'   ? 'block' : 'none';
    document.getElementById('tableView').style.display = v==='table' ? 'block' : 'none';
    document.getElementById('btnCal').classList.toggle('active',   v==='cal');
    document.getElementById('btnTable').classList.toggle('active', v==='table');
    if (v==='table') renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    const today = new Date();
    const todayDay = (today.getMonth()===calMonth&&today.getFullYear()===calYear) ? today.getDate() : -1;
    const dim = new Date(calYear, calMonth+1, 0).getDate();

    for (let d=1; d<=dim; d++) {
      const dd  = getDayData(d);
      const tipo = dd ? dd.tipo : 'libre';
      const dow  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][new Date(calYear,calMonth,d).getDay()];
      const isToday = d===todayDay;

      const badgeLabel = tipo==='morning'?'Mañana':tipo==='evening'?'Tarde':tipo==='lf'?'L. Festivo':'Libre';
      const tr = document.createElement('tr');
      tr.className = `row-${tipo}${isToday?' row-today':''}`;
      tr.innerHTML = `
        <td class="td-day">${d}</td>
        <td class="td-dow">${dow}</td>
        <td class="td-turno" style="color:${tipo==='morning'?'var(--morning-txt)':tipo==='evening'?'var(--evening-txt)':tipo==='lf'?'var(--green)':'var(--red)'}">${dd?.turno||'—'}</td>
        <td class="td-horario">${dd?.horario||'—'}</td>
        <td class="td-estado"><span class="badge-${tipo}">${badgeLabel}</span></td>
        <td class="td-area">${dd?.area||'—'}</td>`;
      tbody.appendChild(tr);
    }
  }

  function getDayData(day) { return calData.find(d=>d.day===day); }

  function renderAll() {
    document.getElementById('headerMonth').textContent = (MONTHS_ES[calMonth]||'—')+' '+calYear;
    renderBanners(); renderStats(); renderCalendar();
  }

  function renderBanners() {
    const today = new Date();
    const isThisMonth = today.getMonth()===calMonth && today.getFullYear()===calYear;
    const todayDay = today.getDate();
    const todayData = isThisMonth ? getDayData(todayDay) : null;

    // Today
    const todayEl = document.getElementById('todayBanner');
    if (todayData) {
      const icon = (todayData.tipo==='libre'||todayData.tipo==='lf') ? '😴' : '⏰';
      todayEl.innerHTML = `<div class="today-banner"><div class="today-icon">${icon}</div><div>
        <div class="today-label">Hoy · ${DAYS_ES[new Date(calYear,calMonth,todayDay).getDay()]}</div>
        <div class="today-val">${todayData.horario||(todayData.tipo==='lf'?'Libre Festivo':'Día libre')}</div>
        ${todayData.area?`<div class="today-area">${todayData.area}</div>`:''}
      </div></div>`;
    } else todayEl.innerHTML='';

    // Next shift
    const nextEl = document.getElementById('nextBanner');
    const fromDay = (isThisMonth && todayData && (todayData.tipo==='morning'||todayData.tipo==='evening')) ? todayDay+1 : (isThisMonth?todayDay:1);
    const next = calData.find(d=>d.day>=fromDay&&(d.tipo==='morning'||d.tipo==='evening'));
    if (next && (!todayData||(todayData.tipo!=='morning'&&todayData.tipo!=='evening'))) {
      const dow = DAYS_ES[new Date(calYear,calMonth,next.day).getDay()];
      nextEl.innerHTML = `<div class="next-banner"><div class="next-icon">📅</div><div>
        <div class="next-label">Próximo turno</div>
        <div class="next-val">${dow} ${next.day} · ${next.horario}</div>
        ${next.area?`<div class="next-area">${next.area}</div>`:''}
      </div></div>`;
    } else nextEl.innerHTML='';
  }

  function renderStats() {
    const work  = calData.filter(d=>d.tipo==='morning'||d.tipo==='evening').length;
    const lib   = calData.filter(d=>d.tipo==='libre').length;
    const lf    = calData.filter(d=>d.tipo==='lf').length;
    const man   = calData.filter(d=>d.tipo==='morning').length;
    const tar   = calData.filter(d=>d.tipo==='evening').length;
    document.getElementById('statsBar').innerHTML = `
      <div class="stat"><div class="stat-num">${work}</div><div class="stat-lbl">Trabajo</div></div>
      <div class="stat"><div class="stat-num" style="color:var(--red)">${lib}</div><div class="stat-lbl">Libres</div></div>
      ${lf?`<div class="stat"><div class="stat-num" style="color:var(--green)">${lf}</div><div class="stat-lbl">L.Festivo</div></div>`:''}
      <div class="stat"><div class="stat-num" style="color:var(--morning-txt)">${man}</div><div class="stat-lbl">Mañana</div></div>
      ${tar?`<div class="stat"><div class="stat-num" style="color:var(--evening-txt)">${tar}</div><div class="stat-lbl">Tarde</div></div>`:''}`;
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML='';
    const firstDOW = new Date(calYear,calMonth,1).getDay();
    const offset   = firstDOW===0 ? 6 : firstDOW-1;
    const dim      = new Date(calYear,calMonth+1,0).getDate();
    const today    = new Date();
    const todayDay = (today.getMonth()===calMonth&&today.getFullYear()===calYear) ? today.getDate() : -1;

    for (let i=0;i<offset;i++) {
      const el=document.createElement('div'); el.className='cal-day empty'; grid.appendChild(el);
    }
    for (let d=1;d<=dim;d++) {
      const dd   = getDayData(d);
      const tipo = dd ? dd.tipo : 'libre';
      const tag  = !dd ? '—' : tipo==='lf'?'LF':tipo==='libre'?'—':(dd.turno+'h');
      const el   = document.createElement('div');
      el.className = `cal-day ${tipo}${d===todayDay?' is-today':''}`;
      el.innerHTML = `<div class="day-num">${d}</div><div class="day-tag">${tag}</div>`;
      el.onclick   = () => openModal(d);
      grid.appendChild(el);
    }
  }

  function openModal(day) {
    const d = getDayData(day); if(!d) return;
    const dow = DAYS_ES[new Date(calYear,calMonth,day).getDay()];
    document.getElementById('modalDate').textContent    = `${day} de ${MONTHS_ES[calMonth]}`;
    document.getElementById('modalDayname').textContent = dow;
    const icons = {morning:'☀️ Turno mañana', evening:'🌆 Turno tarde', lf:'🌿 Libre Festivo', libre:'😴 Día libre'};
    document.getElementById('modalPill').innerHTML = `<div class="modal-pill ${d.tipo}">${icons[d.tipo]||''}</div>`;
    let rows='';
    if (d.tipo==='morning'||d.tipo==='evening') {
      rows+=`<div class="modal-row"><span class="modal-row-label">Turno</span><span class="modal-row-val">${d.turno}</span></div>`;
      rows+=`<div class="modal-row"><span class="modal-row-label">Horario</span><span class="modal-row-val">${d.horario}</span></div>`;
      if(d.area) rows+=`<div class="modal-row"><span class="modal-row-label">Área</span><span class="modal-row-val">${d.area}</span></div>`;
    } else {
      rows+=`<div class="modal-row"><span class="modal-row-label">Tipo</span><span class="modal-row-val">${d.tipo==='lf'?'Libre Festivo':'Día libre'}</span></div>`;
    }
    document.getElementById('modalRows').innerHTML=rows;
    document.getElementById('modalOverlay').classList.add('open');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
